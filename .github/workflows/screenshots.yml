name: App Store Screenshots

on:
  workflow_dispatch:
  push:
    branches:
      - claude/ios-sudoku-game-app-011CUofbb9KeLdjVAsxUxpxs
    paths:
      - "SudokuGame/**"
      - "tools/take_screenshots.sh"
      - ".github/workflows/screenshots.yml"

concurrency:
  group: screenshots
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Capture screenshots
        run: bash tools/take_screenshots.sh AppStore/screenshots

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AppStore/screenshots
          if git diff --cached --quiet; then
            echo "No screenshot changes"
            exit 0
          fi
          git commit -m "Update App Store screenshots [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((attempt * 5))
          done
          exit 1
